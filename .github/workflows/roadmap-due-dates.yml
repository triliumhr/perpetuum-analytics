# One-off: gives the roadmap milestones their quarter end as due date. Removed in the next commit.
name: Roadmap due dates

on:
    push:
        branches: [claude/project-thread-g8m6i1]
        paths: [.github/workflows/roadmap-due-dates.yml]

permissions:
    issues: write

jobs:
    due-dates:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Set due dates
              run: |
                  due() {
                      number=$(gh api "repos/$GH_REPO/milestones?state=all" --jq ".[] | select(.title == \"$1\") | .number")
                      gh api -X PATCH "repos/$GH_REPO/milestones/$number" -f due_on="$2" --jq '"\(.title) due \(.due_on)"'
                  }
                  due '3.1' '2026-12-31T23:59:59Z'
                  due '3.2' '2027-03-31T23:59:59Z'
