# The 2.x line gets security fixes only, until 30 April 2027 (SECURITY.md on main).
# This build proves a fix can be released from this branch; it reproduces the published 2.0.20 code exactly.
name: CI (2.x)

on:
    push:
        branches: [2.x]
    pull_request:
        branches: [2.x]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build the 2.x package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm
            # The 2.x lockfile was written with legacy peer resolution; husky's prepare hook is not needed in CI.
            - run: npm ci --legacy-peer-deps --ignore-scripts
            - run: npx ng build perpetuum-analytics --configuration production
              env:
                  NG_CLI_ANALYTICS: 'false'
            - run: npm pack --dry-run
              working-directory: dist/perpetuum-analytics
