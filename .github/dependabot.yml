version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          angular:
              patterns: ['@angular/*', '@angular-eslint/*', 'angular-eslint', 'ng-packagr']
          tooling:
              patterns: ['*']
              exclude-patterns: ['@angular/*', '@angular-eslint/*', 'angular-eslint', 'ng-packagr']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
