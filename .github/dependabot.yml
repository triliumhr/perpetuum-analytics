# Weekly dependency updates, grouped so one review covers a whole toolchain.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Zagreb
      open-pull-requests-limit: 5
      groups:
          angular:
              patterns: ['@angular/*', '@angular-devkit/*', 'ng-packagr', 'angular-eslint', '@angular-eslint/*']
          tooling:
              patterns: ['*']
              exclude-patterns: ['@angular/*', '@angular-devkit/*', 'ng-packagr', 'angular-eslint', '@angular-eslint/*']
      # A new Angular major changes the supported range, so it is prepared by hand with the support matrix.
      ignore:
          - dependency-name: '@angular/*'
            update-types: ['version-update:semver-major']
          # Angular fixes the TypeScript range it compiles with (22.2: >=6.0 <6.1), so TypeScript moves with an Angular update.
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major', 'version-update:semver-minor']
          # The types follow the oldest Node the package supports (engines: Node 22), not the newest release.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
          timezone: Europe/Zagreb
